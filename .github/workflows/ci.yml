# Pull-request and main checks. Does not start or destroy local Compose volumes.
# Does not run scheduled destructive integration jobs.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        run: ./mvnw -B test

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GIT_COMMIT: ${{ github.sha }}
        run: |
          npm ci
          npm test
          npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development Compose
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: Validate production-like Compose
        env:
          # Required by docker-compose.prod.yml interpolation only. Not a real secret.
          JWT_SECRET: ci-only-jwt-secret-change-before-any-real-use-32b
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
