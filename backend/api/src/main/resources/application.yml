spring:
  application:
    name: video-platform-api
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:video_platform}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:video}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:video}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${VIDEO_MAX_UPLOAD_SIZE:250MB}
      max-request-size: ${VIDEO_MAX_UPLOAD_SIZE:250MB}

mybatis:
  type-handlers-package: com.kiki.video.api.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: ${VIDEO_MAX_UPLOAD_SIZE:250MB}
    max-swallow-size: ${VIDEO_MAX_UPLOAD_SIZE:250MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-before-any-real-use-32b}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    video-bucket: ${MINIO_VIDEO_BUCKET:videos}
  video:
    max-upload-size: ${VIDEO_MAX_UPLOAD_SIZE:250MB}
    max-file-size: ${VIDEO_MAX_FILE_SIZE:10GB}
    chunk-size: ${VIDEO_UPLOAD_CHUNK_SIZE:8MB}
    session-ttl: ${VIDEO_UPLOAD_SESSION_TTL:24h}
    cleanup-interval: ${VIDEO_UPLOAD_CLEANUP_INTERVAL:15m}
  media:
    max-attempts: ${VIDEO_PROCESSING_MAX_ATTEMPTS:3}
    outbox-poll-interval: ${VIDEO_OUTBOX_POLL_INTERVAL:5s}
    stale-publishing-after: ${VIDEO_OUTBOX_STALE_AFTER:1m}
    outbox-batch-size: ${VIDEO_OUTBOX_BATCH_SIZE:20}
  interaction:
    ttl: ${REDIS_INTERACTION_TTL:10m}
    comment-rate-limit: ${REDIS_COMMENT_RATE_LIMIT:20}
    comment-rate-window: ${REDIS_COMMENT_RATE_WINDOW:1m}
  danmaku:
    history-window: ${DANMAKU_HISTORY_WINDOW:60s}
    max-length: ${DANMAKU_MAX_LENGTH:200}
    rate-limit: ${DANMAKU_RATE_LIMIT:10}
    rate-window: ${DANMAKU_RATE_WINDOW:10s}
    redis-channel: ${DANMAKU_REDIS_CHANNEL:kiki:danmaku}
    timestamp-tolerance: ${DANMAKU_TIMESTAMP_TOLERANCE:2s}
    legacy-max-timestamp: ${DANMAKU_LEGACY_MAX_TIMESTAMP:6h}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
    media-topic: ${ROCKETMQ_MEDIA_TOPIC:media-processing}
    producer-group: ${ROCKETMQ_MEDIA_PRODUCER_GROUP:kiki-media-api}
    consumer-group: ${ROCKETMQ_MEDIA_CONSUMER_GROUP:kiki-media-worker}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
    video-index-alias: ${ELASTICSEARCH_VIDEO_INDEX:kiki-videos}
    video-index-version: ${ELASTICSEARCH_VIDEO_INDEX_VERSION:kiki-videos-v1}
  search:
    outbox-poll-interval: ${SEARCH_OUTBOX_POLL_INTERVAL:5s}
    stale-publishing-after: ${SEARCH_OUTBOX_STALE_AFTER:1m}
    outbox-batch-size: ${SEARCH_OUTBOX_BATCH_SIZE:20}
    rebuild-batch-size: ${SEARCH_REBUILD_BATCH_SIZE:250}
    rebuild: ${SEARCH_REBUILD:false}
