# Local development profile.
# PostgreSQL must be running (docker compose up -d) for the API to start.

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Local-only JWT default. Override with JWT_SECRET in .env for anything beyond development.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-before-any-real-use-32b}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
  media-delivery:
    mode: ${MEDIA_DELIVERY_MODE:presigned}
    url-ttl: ${MEDIA_DELIVERY_URL_TTL:15m}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
